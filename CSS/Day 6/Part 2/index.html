<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .modal-overlay{
            height: 100vh;
            width: 100vw;
            background-color: rgba(250, 235, 215, 0.61);
            position: fixed;
        }
        .modal{
            position: absolute;
            top: 200px;
            right: 600px;
            background-color: aqua;
            width: 500px;
            height: 300px;
        }
    </style>
  </head>
  <body>
    <div class="modal-overlay">
      <div class="modal">
        <h2>Modal Title</h2>
        <p>Modal content goes here</p>
        <button>Close</button>
      </div>
    </div>
  </body>
</html>
