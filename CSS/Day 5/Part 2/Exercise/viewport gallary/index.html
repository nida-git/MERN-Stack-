<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viewport Gallery</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .gallery{
            width: 100vw;
            height: 100vh;
            background-color: aqua;
            font-size: 0;

        }
        .image-slot {
            width: 50%;
            height: 50%;
            background-color: antiquewhite;
            /* border: 2px solid crimson; */
            display: inline-block;
        }
        img{
             width: 100%;
            height: 100%;
        }
    </style>
  </head>
  <body>
    <div class="gallery">
      <div class="image-slot"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSEJAzu5aTrvg0yPTkww7slPkkHuIjxHKsxRnF6YOnvsQ&s=10" alt=""></div>
      <div class="image-slot"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRCXS3GloAtphVwqlpIQpRbe5vzMbFlmBh6eibNQUy_Xg&s=10" alt=""></div>
      <div class="image-slot"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRGcrliXJhewE6g5L-HmeUVr8XTSq3vJOpTi9p4E-y6Ew&s" alt=""></div>
      <div class="image-slot"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQKCm2TrgV_qFZVP8MWuWVNYQ03fj-YQBdT1ur4_5ldZg&s=10" alt=""></div>
    </div>
  </body>
</html>
